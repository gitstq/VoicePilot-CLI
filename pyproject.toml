[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "voicepilot-cli"
version = "0.1.0"
description = "A lightweight local voice AI agent CLI engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "VoicePilot-CLI Contributors"},
]
keywords = ["voice", "ai", "agent", "cli", "tts", "stt", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
ollama = ["ollama>=0.1.0"]
glm = ["zhipuai>=2.0.0"]
tts-pyttsx3 = ["pyttsx3>=2.90"]
tts-edge = ["edge-tts>=6.1.0"]
tui = ["rich>=13.0.0"]
stt-whisper = ["openai-whisper>=20231117"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
all = [
    "openai>=1.0.0",
    "ollama>=0.1.0",
    "zhipuai>=2.0.0",
    "pyttsx3>=2.90",
    "edge-tts>=6.1.0",
    "rich>=13.0.0",
    "openai-whisper>=20231117",
]

[project.scripts]
voicepilot = "voicepilot_cli.cli:main"

[project.urls]
Homepage = "https://github.com/voicepilot-cli/voicepilot-cli"
Repository = "https://github.com/voicepilot-cli/voicepilot-cli"
Issues = "https://github.com/voicepilot-cli/voicepilot-cli/issues"

[tool.setuptools.packages.find]
include = ["voicepilot_cli*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
